/* ---------- 渲染 ---------- */
var screen = document.getElementById("screen");

function render(id) {
  var pg = PAGES[id]; if (!pg) return;
  screen.innerHTML = "";
  var img = document.createElement("img");
  img.src = pg.img; img.className = "fadein"; img.alt = "";
  screen.appendChild(img);
  var spots = pg.spots.slice();
  if (pg.tab) spots = spots.concat(TAB);
  spots.forEach(function (s) {
    var d = document.createElement("div");
    d.className = "spot";
    d.style.left = s[0] + "px"; d.style.top = s[1] + "px";
    d.style.width = s[2] + "px"; d.style.height = s[3] + "px";
    d.addEventListener("click", function (e) { e.stopPropagation(); go(s[4]); });
    screen.appendChild(d);
  });
}

function go(target) {
  if (target === "back") { history.back(); return; }
  if ("#" + target !== location.hash) location.hash = target;
}

window.addEventListener("hashchange", function () {
  render(location.hash.slice(1) || "m5_03");
});

/* 初始：打开即登录页 */
if (!location.hash) history.replaceState(null, "", "#m5_03");
render(location.hash.slice(1) || "m5_03");

/* 预加载全部页面 */
Object.keys(PAGES).forEach(function (k) {
  var i = new Image(); i.src = PAGES[k].img;
});

/* 等比缩放铺满视口（留 12px 呼吸位） */
function fit() {
  var s = Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H);
  document.querySelector(".frame").style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();
